<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>CRM | Manupackaging</title>
    <base href="/" />

    <!-- Favicon do CRM -->
    <link rel="shortcut icon" href="img/logomanuli2.png">

    <!-- Fonte Open Sans (Corrigido para HTTPS) -->
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700" rel="stylesheet">

    <!-- CSS do CRM Legado (Nifty Admin / Bootstrap) -->
    <link href="css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/crm-manulifitasa.min.css?aux=2" rel="stylesheet" />
    <link href="plugins/font-awesome/css/font-awesome.min.css?aux=2" rel="stylesheet" />
    <link href="css/Custom.css?aux=2" rel="stylesheet" />
    <link href="css/AlertBootstrap.css" rel="stylesheet" />

    <!-- Estilos de Isolamento do Blazor -->
    <link href="css/app.css" rel="stylesheet" />
    <link href="Thelus.UI.Interface.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <!-- Loader simples de inicialização -->
        <div style="display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f9f9f9;">
            <div style="text-align: center; font-family: 'Open Sans', sans-serif;">
                <h3 style="color: #2b425b; font-weight: 600;">Iniciando CRM Manuli...</h3>
                <p style="color: #758696;">Aguarde o carregamento do módulo.</p>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        Ocorreu um erro não tratado.
        <a href="" class="reload">Recarregar</a>
        <a class="dismiss">🗙</a>
    </div>

    <!-- 1. Scripts Base Essenciais (jQuery e Bootstrap) -->
    <script src="js/jquery-2.1.1.min.js"></script>
    <script src="js/bootstrap.min.js"></script>

    <!-- 2. Framework Blazor WebAssembly (Carrega PRIMEIRO para assumir o container #app) -->
    <script src="_framework/blazor.webassembly.js"></script>

    <!-- 3. Script do Tema CRM/Nifty (Iniciado APÓS o Blazor para não destruir a div #app) -->
    <script src="js/crm-manulifitasa.min.js"></script>
</body>

</html>
